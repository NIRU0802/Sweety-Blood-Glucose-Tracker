services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Server waits until Postgres is actually ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: 5000
      # Host is "db" (the service name), not localhost
      DATABASE_URL: postgres://postgres:postgres@db:5432/sweety
      # Demo default only. Override with: JWT_SECRET=... docker compose up
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      JWT_EXPIRES_IN: 7d
      APP_TIMEZONE: Asia/Kolkata
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata: